services:
  - type: web
    name: acel-backend
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: acel-database
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ALLOW_DEMO_PAYMENTS
        value: "false"
      - key: CERTIFICATION_FEES
        value: '{"Foundation":100,"Practitioner":250,"Expert":500}'

databases:
  - name: acel-database
    databaseName: acel
    user: acel
    plan: basic-256mb
    region: oregon
